# docker-compose.prod.yml (frontend EC2)
services:
  frontend:
    image: ghcr.io/${GHCR_OWNER}/${FRONTEND_IMAGE}:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    expose:
      - "3000"
    networks:
      - internal

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
    networks:
      - internal

networks:
  internal:
